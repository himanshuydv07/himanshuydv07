# ============================================================
# GitHub Metrics Generator
# Generates rich SVG metrics cards for your profile.
#
# SETUP:
#   1. Create a Personal Access Token (PAT) with the following scopes:
#      - repo (Full control of private repositories)
#      - read:user
#      - read:org
#   2. Go to Settings > Secrets and variables > Actions
#   3. Add a new secret named: METRICS_TOKEN
#   4. Paste your PAT as the value.
# ============================================================

name: 📊 GitHub Metrics

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    name: Update Metrics SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📈 General Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          filename: metrics.svg

      - name: 🧩 Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: B
          filename: metrics.achievements.svg

      - name: 📅 Activity Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 2
          filename: metrics.calendar.svg

      - name: 💬 Most Used Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          filename: metrics.languages.svg
