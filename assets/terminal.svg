<svg width="520" height="340" viewBox="0 0 520 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="520" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <style>
      .term-line { opacity: 0; animation: termFade 0.4s ease forwards; }
      .term-line:nth-child(1)  { animation-delay: 0.3s; }
      .term-line:nth-child(2)  { animation-delay: 0.5s; }
      .term-line:nth-child(3)  { animation-delay: 0.7s; }
      .term-line:nth-child(4)  { animation-delay: 0.9s; }
      .term-line:nth-child(5)  { animation-delay: 1.1s; }
      .term-line:nth-child(6)  { animation-delay: 1.3s; }
      .term-line:nth-child(7)  { animation-delay: 1.5s; }
      .term-line:nth-child(8)  { animation-delay: 1.7s; }
      .term-line:nth-child(9)  { animation-delay: 1.9s; }
      .term-line:nth-child(10) { animation-delay: 2.1s; }
      .term-line:nth-child(11) { animation-delay: 2.3s; }
      .term-line:nth-child(12) { animation-delay: 2.5s; }
      .term-line:nth-child(13) { animation-delay: 2.7s; }
      .term-line:nth-child(14) { animation-delay: 2.9s; }
      .term-line:nth-child(15) { animation-delay: 3.1s; }
      .term-line:nth-child(16) { animation-delay: 3.3s; }
      .cursor-blink { animation: blink 1s step-end infinite 3.5s; opacity: 0; }
      @keyframes termFade {
        to { opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Card background -->
  <rect width="520" height="340" rx="10" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect width="520" height="40" rx="10" fill="#1E293B"/>
  <rect y="30" width="520" height="10" fill="#1E293B"/>

  <!-- Traffic light buttons -->
  <circle cx="20" cy="20" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="20" r="6" fill="#FEBC2E"/>
  <circle cx="60" cy="20" r="6" fill="#28C840"/>

  <!-- Title -->
  <text x="260" y="25" text-anchor="middle"
    font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">
    himanshu@dev — zsh
  </text>

  <!-- Terminal content -->
  <g transform="translate(24, 66)">
    <g class="term-line">
      <text font-family="'JetBrains Mono', monospace" font-size="12" fill="#22C55E">➜</text>
      <text x="16" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">~ </text>
      <text x="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">$ whoami</text>
    </g>
    <g class="term-line">
      <text y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">  Himanshu Yadav</text>
    </g>

    <g class="term-line">
      <text y="48" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22C55E">➜</text>
      <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">~ </text>
      <text x="32" y="48" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">$ role</text>
    </g>
    <g class="term-line">
      <text y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">  Full Stack Developer &amp; Problem Solver</text>
    </g>

    <g class="term-line">
      <text y="96" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22C55E">➜</text>
      <text x="16" y="96" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">~ </text>
      <text x="32" y="96" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">$ education</text>
    </g>
    <g class="term-line">
      <text y="118" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">  B.Tech CSE · VIT Bhopal · CGPA: 9.21</text>
    </g>

    <g class="term-line">
      <text y="144" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22C55E">➜</text>
      <text x="16" y="144" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">~ </text>
      <text x="32" y="144" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">$ interests</text>
    </g>
    <g class="term-line">
      <text y="166" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">  Backend · Cloud · Distributed Systems · AI</text>
    </g>

    <g class="term-line">
      <text y="192" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22C55E">➜</text>
      <text x="16" y="192" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">~ </text>
      <text x="32" y="192" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">$ currently_learning</text>
    </g>
    <g class="term-line">
      <text y="214" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">  System Design · Microservices · Kubernetes</text>
    </g>

    <g class="term-line">
      <text y="240" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22C55E">➜</text>
      <text x="16" y="240" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">~ </text>
      <text x="32" y="240" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">$ status</text>
    </g>
    <g class="term-line">
      <text y="262" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22C55E">  ✓ Open to opportunities</text>
    </g>

    <!-- Prompt with cursor -->
    <g>
      <text y="288" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22C55E">➜</text>
      <text x="16" y="288" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">~ </text>
      <text x="32" y="288" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">$ </text>
      <rect class="cursor-blink" x="48" y="274" width="8" height="16" rx="1" fill="#38BDF8"/>
    </g>
  </g>
</svg>
