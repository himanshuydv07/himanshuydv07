<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Glow gradient for accent line -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="35%" stop-color="#2563EB"/>
      <stop offset="65%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Text glow filter -->
    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#2563EB" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Dot glow filter -->
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');

      .grid-line { opacity: 0; animation: fadeIn 2s ease forwards; }
      .grid-line:nth-child(1) { animation-delay: 0.1s; }
      .grid-line:nth-child(2) { animation-delay: 0.2s; }
      .grid-line:nth-child(3) { animation-delay: 0.3s; }
      .grid-line:nth-child(4) { animation-delay: 0.4s; }
      .grid-line:nth-child(5) { animation-delay: 0.5s; }
      .grid-line:nth-child(6) { animation-delay: 0.6s; }
      .grid-line:nth-child(7) { animation-delay: 0.7s; }
      .grid-line:nth-child(8) { animation-delay: 0.8s; }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      .dot { animation: pulse 3s ease-in-out infinite; }
      .dot-1 { animation-delay: 0s; }
      .dot-2 { animation-delay: 0.5s; }
      .dot-3 { animation-delay: 1s; }
      .dot-4 { animation-delay: 1.5s; }
      .dot-5 { animation-delay: 2s; }
      .dot-6 { animation-delay: 0.8s; }
      .dot-7 { animation-delay: 1.3s; }
      .dot-8 { animation-delay: 1.8s; }

      @keyframes pulse {
        0%, 100% { opacity: 0.2; r: 2; }
        50% { opacity: 0.9; r: 3; }
      }

      .accent-line { 
        stroke-dasharray: 900; 
        stroke-dashoffset: 900; 
        animation: drawLine 2.5s ease forwards 0.3s; 
      }

      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }

      .name-text {
        opacity: 0;
        animation: slideUp 0.8s ease forwards 0.6s;
      }

      .role-text {
        opacity: 0;
        animation: slideUp 0.8s ease forwards 0.9s;
      }

      .tag-text {
        opacity: 0;
        animation: slideUp 0.8s ease forwards 1.1s;
      }

      .badge-group {
        opacity: 0;
        animation: slideUp 0.8s ease forwards 1.3s;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .cursor {
        animation: blink 1s step-end infinite 1.5s;
        opacity: 0;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle grid lines (horizontal) -->
  <g opacity="0.04">
    <line class="grid-line" x1="0" y1="40" x2="900" y2="40" stroke="#38BDF8" stroke-width="0.5"/>
    <line class="grid-line" x1="0" y1="80" x2="900" y2="80" stroke="#38BDF8" stroke-width="0.5"/>
    <line class="grid-line" x1="0" y1="120" x2="900" y2="120" stroke="#38BDF8" stroke-width="0.5"/>
    <line class="grid-line" x1="0" y1="160" x2="900" y2="160" stroke="#38BDF8" stroke-width="0.5"/>
    <line class="grid-line" x1="0" y1="200" x2="900" y2="200" stroke="#38BDF8" stroke-width="0.5"/>
    <line class="grid-line" x1="0" y1="240" x2="900" y2="240" stroke="#38BDF8" stroke-width="0.5"/>
  </g>

  <!-- Subtle grid lines (vertical) -->
  <g opacity="0.03">
    <line class="grid-line" x1="150" y1="0" x2="150" y2="280" stroke="#38BDF8" stroke-width="0.5"/>
    <line class="grid-line" x1="300" y1="0" x2="300" y2="280" stroke="#38BDF8" stroke-width="0.5"/>
    <line class="grid-line" x1="450" y1="0" x2="450" y2="280" stroke="#38BDF8" stroke-width="0.5"/>
    <line class="grid-line" x1="600" y1="0" x2="600" y2="280" stroke="#38BDF8" stroke-width="0.5"/>
    <line class="grid-line" x1="750" y1="0" x2="750" y2="280" stroke="#38BDF8" stroke-width="0.5"/>
  </g>

  <!-- Moving dots -->
  <circle class="dot dot-1" cx="80" cy="60" r="2" fill="#38BDF8" filter="url(#dotGlow)"/>
  <circle class="dot dot-2" cx="200" cy="220" r="2" fill="#2563EB" filter="url(#dotGlow)"/>
  <circle class="dot dot-3" cx="720" cy="80" r="2" fill="#38BDF8" filter="url(#dotGlow)"/>
  <circle class="dot dot-4" cx="840" cy="200" r="2" fill="#2563EB" filter="url(#dotGlow)"/>
  <circle class="dot dot-5" cx="400" cy="240" r="1.5" fill="#38BDF8" filter="url(#dotGlow)"/>
  <circle class="dot dot-6" cx="650" cy="40" r="1.5" fill="#38BDF8" filter="url(#dotGlow)"/>
  <circle class="dot dot-7" cx="130" cy="170" r="1.5" fill="#2563EB" filter="url(#dotGlow)"/>
  <circle class="dot dot-8" cx="800" cy="140" r="1.5" fill="#38BDF8" filter="url(#dotGlow)"/>

  <!-- Corner accent marks -->
  <g opacity="0.5">
    <path d="M 16 30 L 16 16 L 30 16" stroke="#38BDF8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 870 16 L 884 16 L 884 30" stroke="#38BDF8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 16 250 L 16 264 L 30 264" stroke="#38BDF8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 870 264 L 884 264 L 884 250" stroke="#38BDF8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Accent horizontal line -->
  <line class="accent-line" x1="0" y1="205" x2="900" y2="205" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Main Content -->
  <!-- Label -->
  <text class="role-text" x="450" y="68" text-anchor="middle"
    font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" letter-spacing="3" opacity="0.85">
    SOFTWARE ENGINEER · FULL STACK DEVELOPER
  </text>

  <!-- Name -->
  <text class="name-text" x="450" y="140" text-anchor="middle"
    font-family="'Space Grotesk', 'Inter', sans-serif" font-size="58" font-weight="700"
    fill="#E2E8F0" filter="url(#softGlow)" letter-spacing="-1">
    Himanshu Yadav
  </text>
  <text class="cursor" x="700" y="138" font-family="'JetBrains Mono', monospace" font-size="48" fill="#2563EB">|</text>

  <!-- Tagline -->
  <text class="tag-text" x="450" y="176" text-anchor="middle"
    font-family="'Inter', sans-serif" font-size="15" font-weight="400"
    fill="#94A3B8" letter-spacing="0.3">
    Building scalable systems · B.Tech CSE @ VIT Bhopal · 9.21 GPA
  </text>

  <!-- Bottom badge row -->
  <g class="badge-group">
    <!-- VIT Bhopal -->
    <rect x="198" y="222" width="108" height="26" rx="5" fill="#1E293B" stroke="#2563EB" stroke-width="0.8" opacity="0.9"/>
    <text x="252" y="239" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">VIT Bhopal</text>

    <!-- AWS -->
    <rect x="318" y="222" width="80" height="26" rx="5" fill="#1E293B" stroke="#2563EB" stroke-width="0.8" opacity="0.9"/>
    <text x="358" y="239" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">AWS Cloud</text>

    <!-- LeetCode -->
    <rect x="410" y="222" width="96" height="26" rx="5" fill="#1E293B" stroke="#22C55E" stroke-width="0.8" opacity="0.9"/>
    <text x="458" y="239" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22C55E">1800 LC Rating</text>

    <!-- Open Source -->
    <rect x="518" y="222" width="100" height="26" rx="5" fill="#1E293B" stroke="#2563EB" stroke-width="0.8" opacity="0.9"/>
    <text x="568" y="239" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">Open Source</text>

    <!-- React -->
    <rect x="630" y="222" width="72" height="26" rx="5" fill="#1E293B" stroke="#2563EB" stroke-width="0.8" opacity="0.9"/>
    <text x="666" y="239" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">React · TS</text>
  </g>
</svg>
